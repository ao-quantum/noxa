[package]
name = "cadrs"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "mysql", "chrono" ] }
serde_json = "1.0.140"
serde = "1.0.219"
dotenv = "0.15.0"
chrono = { version = "0.4.40", features = ["serde"] }
rocket = { version = "0.5.1", features = ["json"]}
rocket_cors = "0.6.0"
